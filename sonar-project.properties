# Project identification
sonar.projectKey=mohamedsayah97_location_backend
sonar.organization=mohamedsayah97

# Source code
sonar.sources=api-gateway/src,booking-service/src,vehicle-service/src

# Tests
sonar.tests=api-gateway/src,booking-service/src,vehicle-service/src
sonar.test.inclusions=**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,vehicle-service/src/generated/**

# Jest coverage reports
sonar.javascript.lcov.reportPaths=api-gateway/coverage/lcov.info,booking-service/coverage/lcov.info,vehicle-service/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8