
name: Car Rental CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - vehicle-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Booking Prisma Client
        if: matrix.service == 'booking-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Generate Vehicle Prisma Client
        if: matrix.service == 'vehicle-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Build service
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
