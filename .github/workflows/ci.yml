
name: Car Rental CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - vehicle-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Booking Prisma Client
        if: matrix.service == 'booking-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Generate Vehicle Prisma Client
        if: matrix.service == 'vehicle-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Build service
        run: npm run build

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: error

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download API Gateway coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-api-gateway
          path: api-gateway/coverage

      - name: Download Booking Service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-booking-service
          path: booking-service/coverage

      - name: Download Vehicle Service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-vehicle-service
          path: vehicle-service/coverage

      - name: Fix LCOV paths
        run: |
          sed -i 's#^SF:src\\#SF:api-gateway/src/#; s#\\#/#g' api-gateway/coverage/lcov.info
          sed -i 's#^SF:src\\#SF:booking-service/src/#; s#\\#/#g' booking-service/coverage/lcov.info
          sed -i 's#^SF:src\\#SF:vehicle-service/src/#; s#\\#/#g' vehicle-service/coverage/lcov.info

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
