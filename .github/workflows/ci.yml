
name: Car Rental CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - vehicle-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Booking Prisma Client
        if: matrix.service == 'booking-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Generate Vehicle Prisma Client
        if: matrix.service == 'vehicle-service'
        run: npx prisma generate --config prisma7.config.ts

      - name: Build service
        run: npm run build

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/
          if-no-files-found: error

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download API Gateway coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-api-gateway
          path: coverage-artifacts/api-gateway

      - name: Download Booking Service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-booking-service
          path: coverage-artifacts/booking-service

      - name: Download Vehicle Service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-vehicle-service
          path: coverage-artifacts/vehicle-service

      - name: Restore coverage reports
        run: |
          mkdir -p api-gateway/coverage
          mkdir -p booking-service/coverage
          mkdir -p vehicle-service/coverage

          cp coverage-artifacts/api-gateway/lcov.info api-gateway/coverage/
          cp coverage-artifacts/booking-service/lcov.info booking-service/coverage/
          cp coverage-artifacts/vehicle-service/lcov.info vehicle-service/coverage/

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
